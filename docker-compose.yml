services:
  antigravity-proxy:
    build: .
    container_name: antigravity-oauth-proxy
    restart: unless-stopped
    ports:
      - "9878:9878"
    environment:
      - PORT=9878
      - ADMIN_API_KEY=${ADMIN_API_KEY:-replace-with-a-long-random-value}
      # Optional: set GCP project ID if automatic project discovery is not desired
      # - CLOUDCODE_GCP_PROJECT_ID=your-project-id
      # - LOG_LEVEL=info
    volumes:
      # Mount host OAuth credentials directory for persistent auto-refresh tokens
      - ~/.config/antigravity-oauth-proxy:/root/.config/antigravity-oauth-proxy:rw

  # On-demand authentication helper service
  # Run with: docker compose run --rm auth
  auth:
    build: .
    container_name: antigravity-oauth-auth
    entrypoint: ["/app/auth", "-no-browser"]
    stdin_open: true
    tty: true
    volumes:
      - ~/.config/antigravity-oauth-proxy:/root/.config/antigravity-oauth-proxy:rw
    profiles:
      - auth
