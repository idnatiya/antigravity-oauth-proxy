<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Proxy — Usage Telemetry & Control Plane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --background: #ffffff;
      --foreground: #09090b;
      --sidebar: #fafafa;
      --sidebar-border: #e4e4e7;
      --card: #ffffff;
      --card-foreground: #09090b;
      --muted: #f4f4f5;
      --muted-foreground: #71717a;
      --border: #e4e4e7;
      --input: #e4e4e7;
      --primary: #2563eb;
      --primary-foreground: #ffffff;
      --accent: #f4f4f5;
      --destructive: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 0.5rem;
    }

    html.dark {
      --background: #141518;
      --foreground: #f4f4f6;
      --sidebar: #101114;
      --sidebar-border: #24262e;
      --card: #202227;
      --card-foreground: #f4f4f6;
      --muted: #2a2d34;
      --muted-foreground: #9ea0ab;
      --border: #2c2e36;
      --input: #272930;
      --primary: #3b82f6;
      --primary-foreground: #ffffff;
      --accent: #353842;
      --destructive: #ff453a;
      --success: #30d158;
      --warning: #ff9f0a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-color: var(--border);
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      line-height: 1.45rem;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }

    /* Utilities */
    .font-mono { font-family: var(--font-mono); }
    .bg-sidebar { background-color: var(--sidebar); }
    .border-sidebar { border-color: var(--sidebar-border); }
    .animate-pulse-dot {
      animation: pulse-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    /* Layout Containers */
    .app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header {
      height: 3.5rem;
      border-bottom: 1px solid var(--sidebar-border);
      background: var(--sidebar);
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      z-index: 30;
      user-select: none;
    }
    .workspace { display: flex; flex: 1; min-height: 0; position: relative; }
    .sidebar {
      width: 15rem;
      border-right: 1px solid var(--sidebar-border);
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .main-content {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 1.5rem;
    }

    /* Split Login Layout */
    .login-container {
      display: grid;
      min-height: 100vh;
      grid-template-columns: 1fr;
      background: var(--background);
      position: relative;
    }
    @media (min-width: 1024px) {
      .login-container { grid-template-columns: 1.15fr 1fr; }
    }
    .login-hero {
      display: none;
      position: relative;
      flex-direction: column;
      justify-content: space-between;
      padding: 3.5rem;
      background: var(--sidebar);
      border-right: 1px solid var(--sidebar-border);
      overflow: hidden;
      user-select: none;
    }
    @media (min-width: 1024px) { .login-hero { display: flex; } }

    /* Glows */
    .glow-top {
      position: absolute;
      top: -6rem; left: -6rem;
      width: 24rem; height: 24rem;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.12);
      filter: blur(80px);
      pointer-events: none;
    }
    .glow-bottom {
      position: absolute;
      bottom: -6rem; right: -6rem;
      width: 24rem; height: 24rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.10);
      filter: blur(80px);
      pointer-events: none;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      transition: border-color 0.15s ease;
    }
    .card:hover { border-color: rgba(59, 130, 246, 0.4); }
    .card-header {
      padding: 1.25rem 1.25rem 0.5rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-foreground);
    }
    .card-content { padding: 0.5rem 1.25rem 1.25rem 1.25rem; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: var(--radius);
      font-size: 0.8125rem;
      font-weight: 500;
      padding: 0.45rem 0.85rem;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--foreground);
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover { background: var(--muted); }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
      font-weight: 600;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-icon {
      padding: 0.45rem;
      border-radius: var(--radius);
      color: var(--muted-foreground);
    }
    .btn-icon:hover { color: var(--foreground); background: var(--muted); }

    /* Form Controls */
    .input-field {
      width: 100%;
      height: 2.4rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--foreground);
      padding: 0 0.75rem;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--muted);
      color: var(--foreground);
    }
    .badge-success {
      background: rgba(48, 209, 88, 0.12);
      border-color: rgba(48, 209, 88, 0.25);
      color: var(--success);
    }
    .badge-warning {
      background: rgba(255, 159, 10, 0.12);
      border-color: rgba(255, 159, 10, 0.25);
      color: var(--warning);
    }
    .badge-danger {
      background: rgba(255, 69, 58, 0.12);
      border-color: rgba(255, 69, 58, 0.25);
      color: var(--destructive);
    }

    /* Nav Links */
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius);
      color: var(--muted-foreground);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .nav-item:hover { background: var(--muted); color: var(--foreground); }
    .nav-item.active {
      background: var(--accent);
      color: var(--foreground);
      font-weight: 600;
    }

    /* Tables */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-foreground);
      border-bottom: 1px solid var(--border);
      background: var(--sidebar);
    }
    td {
      padding: 0.85rem 1rem;
      font-size: 0.8125rem;
      border-bottom: 1px solid var(--border);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    /* Toast Notice */
    .toast-notice {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius);
      font-size: 0.8125rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
      animation: slide-up 0.2s ease-out;
    }
    @keyframes slide-up {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Grids */
    .grid-kpi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .grid-analytics {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 900px) {
      .grid-analytics { grid-template-columns: 1fr; }
    }

    /* SVG Chart */
    .chart-svg {
      width: 100%;
      height: 180px;
      overflow: visible;
    }
  </style>
</head>
<body>

  <!-- ROOT CONTAINER -->
  <div id="app"></div>

  <script>
    // State management
    const state = {
      authenticated: false,
      user: null,
      activeTab: 'overview',
      timeRange: '24h',
      stats: null,
      account: null,
      requests: [],
      requestsTotal: 0,
      requestsLimit: 25,
      requestsOffset: 0,
      requestsFilter: { model: '', status: '', search: '' },
      loadingStats: false,
      loadingRequests: false,
      theme: localStorage.getItem('theme') || 'dark',
      toast: null
    };

    // Apply theme on load
    if (state.theme === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', state.theme);
      if (state.theme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
      render();
    }

    function showToast(text, isError = false) {
      state.toast = { text, isError };
      render();
      setTimeout(() => {
        if (state.toast && state.toast.text === text) {
          state.toast = null;
          render();
        }
      }, 4000);
    }

    function formatNumber(num) {
      if (num === null || num === undefined) return '0';
      if (num >= 1_000_000) return (num / 1_000_000).toFixed(2) + 'M';
      if (num >= 1_000) return (num / 1_000).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    function formatCurrency(amount) {
      return '$' + (amount || 0).toFixed(4);
    }

    function formatTime(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' ' + (d.getMonth() + 1) + '/' + d.getDate();
    }

    // API Helpers
    async function api(path, opts = {}) {
      opts.headers = opts.headers || {};
      if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      const res = await fetch(path, opts);
      if (res.status === 401) {
        state.authenticated = false;
        state.user = null;
        render();
        throw new Error('Unauthorized');
      }
      if (!res.ok) {
        let errMsg = 'Request failed';
        try {
          const errData = await res.json();
          errMsg = errData.error || errData.message || errMsg;
        } catch (_) {}
        throw new Error(errMsg);
      }
      return res.json();
    }

    async function checkAuth() {
      try {
        const data = await api('/api/auth/me');
        if (data.authenticated) {
          state.authenticated = true;
          state.user = data.username;
          loadStats();
          loadRequests();
        } else {
          state.authenticated = false;
        }
      } catch (_) {
        state.authenticated = false;
      }
      render();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = e.target.username.value.trim();
      const password = e.target.password.value;
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.innerText = 'Signing in...';

      try {
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: { username, password }
        });
        state.authenticated = true;
        state.user = data.username;
        showToast('Signed in successfully');
        loadStats();
        loadRequests();
      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Sign In';
        render();
      }
    }

    async function handleLogout() {
      try {
        await api('/api/auth/logout', { method: 'POST' });
      } catch (_) {}
      state.authenticated = false;
      state.user = null;
      showToast('Logged out');
      render();
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const current_password = e.target.current_password.value;
      const new_password = e.target.new_password.value;
      const confirm_password = e.target.confirm_password.value;

      if (new_password !== confirm_password) {
        showToast('New passwords do not match', true);
        return;
      }

      try {
        await api('/api/auth/change-password', {
          method: 'POST',
          body: { current_password, new_password }
        });
        showToast('Password changed successfully!');
        e.target.reset();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function loadStats() {
      if (!state.authenticated) return;
      state.loadingStats = true;
      render();
      try {
        const data = await api(`/api/usage/stats?range=${state.timeRange}`);
        state.stats = data.stats;
        state.account = data.account;
      } catch (err) {
        console.error('Stats error:', err);
      } finally {
        state.loadingStats = false;
        render();
      }
    }

    async function loadRequests() {
      if (!state.authenticated) return;
      state.loadingRequests = true;
      render();
      try {
        let query = `/api/usage/requests?limit=${state.requestsLimit}&offset=${state.requestsOffset}`;
        if (state.requestsFilter.model) query += `&model=${encodeURIComponent(state.requestsFilter.model)}`;
        if (state.requestsFilter.status) query += `&status=${encodeURIComponent(state.requestsFilter.status)}`;
        if (state.requestsFilter.search) query += `&search=${encodeURIComponent(state.requestsFilter.search)}`;

        const data = await api(query);
        state.requests = data.requests || [];
        state.requestsTotal = data.total || 0;
      } catch (err) {
        console.error('Requests error:', err);
      } finally {
        state.loadingRequests = false;
        render();
      }
    }

    function setTab(tab) {
      state.activeTab = tab;
      if (tab === 'logs') loadRequests();
      render();
    }

    function setTimeRange(range) {
      state.timeRange = range;
      loadStats();
    }

    // Auto-refresh every 10 seconds if on overview
    setInterval(() => {
      if (state.authenticated && state.activeTab === 'overview') {
        loadStats();
      }
    }, 10000);

    // SVG Line/Area Chart Generator
    function renderAreaChart(timeline) {
      if (!timeline || timeline.length === 0) {
        return `<div style="height:180px; display:flex; align-items:center; justify-content:center; color:var(--muted-foreground); font-size:0.75rem; font-family:var(--font-mono);">Awaiting traffic activity...</div>`;
      }

      const points = timeline.slice(-24); // max 24 buckets
      const maxReq = Math.max(...points.map(p => p.requests), 1);
      const width = 600;
      const height = 160;
      const pad = 20;

      const coords = points.map((p, idx) => {
        const x = pad + (idx / Math.max(1, points.length - 1)) * (width - pad * 2);
        const y = height - pad - (p.requests / maxReq) * (height - pad * 2);
        return { x, y, ...p };
      });

      let linePath = `M ${coords[0].x} ${coords[0].y}`;
      coords.slice(1).forEach(pt => {
        linePath += ` L ${pt.x} ${pt.y}`;
      });

      const areaPath = `${linePath} L ${coords[coords.length - 1].x} ${height - pad} L ${coords[0].x} ${height - pad} Z`;

      return `
        <svg viewBox="0 0 ${width} ${height}" class="chart-svg" preserveAspectRatio="none">
          <defs>
            <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <!-- Grid lines -->
          <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="var(--border)" stroke-width="1" />
          <line x1="${pad}" y1="${pad}" x2="${width - pad}" y2="${pad}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3" />

          <!-- Area -->
          <path d="${areaPath}" fill="url(#chartGradient)" />
          <!-- Line -->
          <path d="${linePath}" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Dots -->
          ${coords.map(pt => `
            <circle cx="${pt.x}" cy="${pt.y}" r="3" fill="#3b82f6" stroke="var(--card)" stroke-width="1.5">
              <title>${pt.time_bucket}: ${pt.requests} requests (${formatNumber(pt.total_tokens)} tokens)</title>
            </circle>
          `).join('')}
        </svg>
      `;
    }

    // MAIN RENDER FUNCTION
    function render() {
      const app = document.getElementById('app');

      // 1. Toast Notification
      let toastHTML = '';
      if (state.toast) {
        toastHTML = `
          <div class="toast-notice ${state.toast.isError ? 'badge-danger' : 'badge-success'}">
            <span>${state.toast.isError ? '✕' : '✓'}</span>
            <span>${state.toast.text}</span>
          </div>
        `;
      }

      // 2. Unauthenticated: Render Split-Screen Login View
      if (!state.authenticated) {
        app.innerHTML = `
          ${toastHTML}
          <div class="login-container">
            <!-- Theme Toggle top right -->
            <div style="position:absolute; right:1.25rem; top:1.25rem; z-index:40;">
              <button class="btn btn-icon" onclick="toggleTheme()" title="Toggle theme">
                ${state.theme === 'dark' ? '☀️' : '🌙'}
              </button>
            </div>

            <!-- Left Hero Section (Netradock Style) -->
            <div class="login-hero">
              <div class="glow-top"></div>
              <div class="glow-bottom"></div>

              <!-- Top Brand -->
              <div style="display:flex; align-items:center; gap:0.75rem;">
                <div style="width:2.25rem; height:2.25rem; border-radius:0.5rem; background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.3); display:flex; align-items:center; justify-content:center; color:#3b82f6; font-size:1.15rem; font-weight:700;">
                  ⚡
                </div>
                <div>
                  <div style="font-weight:700; font-size:1.05rem; letter-spacing:-0.02em;">Antigravity Proxy</div>
                  <div style="font-size:0.72rem; color:var(--muted-foreground); font-family:var(--font-mono);">v1.0.0 • SQLite WAL</div>
                </div>
              </div>

              <!-- Center Value Proposition & Mockup Card -->
              <div style="margin: auto 0; padding: 2rem 0; space-y: 2rem;">
                <div style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.25rem 0.75rem; border-radius:9999px; border:1px solid rgba(59,130,246,0.25); background:rgba(59,130,246,0.1); color:var(--primary); font-family:var(--font-mono); font-size:0.75rem; margin-bottom:1rem;">
                  <span style="width:6px; height:6px; border-radius:9999px; background:var(--primary);" class="animate-pulse-dot"></span>
                  <span>AI Gateway & Usage Telemetry</span>
                </div>

                <h1 style="font-size:2rem; font-weight:700; line-height:1.25; margin-bottom:0.75rem; letter-spacing:-0.03em;">
                  Real-time LLM Usage Telemetry & Cost Control.
                </h1>
                <p style="color:var(--muted-foreground); font-size:0.875rem; max-width:440px; margin-bottom:2rem; line-height:1.6;">
                  Monitor token consumption, track model latency, and view historical request logs for Antigravity-powered Gemini & OpenAI clients.
                </p>

                <!-- Simulated Telemetry Mockup Card -->
                <div class="card" style="max-width:440px; padding:1rem; font-family:var(--font-mono); font-size:0.75rem; background:rgba(32,34,39,0.85); backdrop-filter:blur(10px);">
                  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:0.6rem; margin-bottom:0.75rem;">
                    <div style="display:flex; align-items:center; gap:0.4rem;">
                      <span style="width:8px; height:8px; border-radius:50%; background:#ef4444;"></span>
                      <span style="width:8px; height:8px; border-radius:50%; background:#f59e0b;"></span>
                      <span style="width:8px; height:8px; border-radius:50%; background:#10b981;"></span>
                      <span style="color:var(--muted-foreground); font-size:0.7rem; margin-left:0.4rem;">antigravity-proxy :9878</span>
                    </div>
                    <span class="badge badge-success font-mono" style="font-size:0.65rem;">
                      <span style="width:5px; height:5px; border-radius:50%; background:#10b981;" class="animate-pulse-dot"></span>
                      CONNECTED
                    </span>
                  </div>

                  <div style="display:flex; flex-direction:column; gap:0.4rem;">

      return `
        <table>
          <thead>
            <tr>

              <th>Comp Tok</th>
              <th>Savings</th>
            </tr>
          </thead>
          <tbody>
            ${requests.map(r => {
              const statusClass = r.status_code < 400 ? 'badge-success' : r.status_code === 429 ? 'badge-warning' : 'badge-danger';

                  <td style="font-family:var(--font-mono); font-size:0.75rem; color:#10b981;">${formatCurrency(r.cost_savings)}</td>
